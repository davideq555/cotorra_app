name: cotorra_app
description: "Aplicacion movil de kotorra"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.0
  provider: ^6.1.2
  shared_preferences: ^2.2.0
  url_launcher: ^6.2.0
  flutter_dotenv: ^5.1.0
  dropdown_search: ^6.0.0
  file_picker: ^8.0.0
  pdfrx: ^2.4.4
  path_provider: ^2.1.0
  dio: ^5.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/free.png
    - assets/images/logotipo.png
    - assets/images/search.png
    - .env